services:
  postgres-db:
    image: postgres:16-alpine
    container_name: helpdesk_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  helpdesk-api:
    build: .
    container_name: helpdesk_api_container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5208:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

  helpdesk-frontend:
    build: ./helpdesk-frontend
    container_name: helpdesk_frontend_container
    ports:
      - "5173:80"
    depends_on:
      - helpdesk-api
    restart: unless-stopped

volumes:
  postgres_data: